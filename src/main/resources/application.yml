spring:
  application:
    name: livrotech
  profiles:
    default: dev
  jpa:
    open-in-view: false
app:
  security:
    enabled: false
  jwt:
    secret: ${APP_JWT_SECRET:livrotech-dev-secret-key-12345678901234567890}
  seed-data:
    enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"