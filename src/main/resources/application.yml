spring:
  application:
    name: livrotech
  profiles:
    default: dev
  jpa:
    open-in-view: false
app:
  security:
    enabled: false
    require-https: false
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  jwt:
    secret: ${APP_JWT_SECRET:livrotech-dev-secret-key-12345678901234567890}
    issuer: ${APP_JWT_ISSUER:livrotech-api}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  seed-data:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Livrotech API para gestão de livros, clientes, funcionários e vendas.
    version: @project.version@

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"