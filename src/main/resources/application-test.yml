spring:
  datasource:
    url: jdbc:h2:mem:livrotech-test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

logging:
  level:
    org.hibernate.SQL: WARN
