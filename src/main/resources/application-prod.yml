spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    # Do not print SQL statements in production
    org.hibernate.SQL: WARN
    # Avoid logging bind parameter values (sensitive)
    org.hibernate.type.descriptor.sql: WARN
