spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:livrotech}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    # Do not print SQL statements in production
    org.hibernate.SQL: WARN
    # Avoid logging bind parameter values (sensitive)
    org.hibernate.type.descriptor.sql: WARN
